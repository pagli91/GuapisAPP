<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GuapisAPP">
<link rel="apple-touch-icon" href="https://pagli91.github.io/GuapisAPP/icon-192.png">
<link rel="manifest" href="https://pagli91.github.io/GuapisAPP/manifest.json">
<title>GuapisAPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf7f2;--bg2:#f3ede3;--bg3:#ede5d8;--card:#ffffff;
  --border:rgba(160,130,90,0.15);--border2:rgba(160,130,90,0.28);
  --text:#2c2318;--text2:#7a6650;--text3:#b09a80;
  --accent:#c96a2e;--accent-bg:#fdf0e8;--accent2:#e8a96a;
  --green:#5a9e6f;--green-bg:#edf6f0;
  --blue:#4a7fa5;--blue-bg:#eaf2f8;
  --purple:#7c5cbf;--purple-bg:#f0ebfa;
  --teal:#2a9d8f;--teal-bg:#e8f5f3;
  --radius:18px;--radius-sm:12px;
  --shadow:0 2px 16px rgba(100,70,30,0.08);
  --shadow-lg:0 8px 32px rgba(100,70,30,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100vh}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(250,247,242,0.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;font-family:'Nunito',sans-serif;letter-spacing:.03em;transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn span:first-child{font-size:22px}

.header{position:sticky;top:0;z-index:10;background:rgba(250,247,242,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:env(safe-area-inset-top,0) 0 0;border-bottom:1px solid var(--border)}
.header-inner{padding:16px 22px 14px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;flex-direction:column;gap:1px}
.header-greeting{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.header-title{font-family:'Lora',serif;font-size:22px;font-weight:500;color:var(--text);letter-spacing:-0.01em}
.sync-pill{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:20px;padding:6px 12px;border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text3)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s}
.sync-dot.syncing{background:var(--accent2);animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.scroll-area{flex:1;overflow-y:auto;padding:20px 20px 100px;-webkit-overflow-scrolling:touch}
.section-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin:0 0 12px 2px}

/* Reminder */
.reminder-strip{margin-bottom:24px}
.reminder-empty{font-size:13px;color:var(--text3);padding:10px 0 18px}
.reminder-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;display:flex;align-items:center;gap:12px;margin-bottom:7px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.reminder-card:active{transform:scale(.98)}
.reminder-date-box{display:flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;flex-shrink:0;background:var(--accent-bg)}
.reminder-date-box.today{background:var(--accent)}
.reminder-day{font-size:16px;font-weight:700;color:var(--accent);line-height:1}
.reminder-date-box.today .reminder-day{color:#fff}
.reminder-mon{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--accent2);letter-spacing:.04em}
.reminder-date-box.today .reminder-mon{color:rgba(255,255,255,.8)}
.reminder-info{flex:1;min-width:0}
.reminder-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reminder-sub{font-size:12px;color:var(--text2);margin-top:2px}
.reminder-who{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;flex-shrink:0}
.who-both{background:var(--purple-bg);color:var(--purple)}
.who-solo{background:var(--bg2);color:var(--text2)}

/* List cards */
.lists-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.list-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;position:relative;overflow:hidden}
.list-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;background:var(--card-accent,var(--accent))}
.list-card:active{transform:scale(.985)}
.list-card.type-shopping{--card-accent:#c96a2e}
.list-card.type-travel{--card-accent:#4a7fa5}
.list-card.type-custom{--card-accent:#5a9e6f}
.list-card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.type-shopping .list-card-icon{background:var(--accent-bg)}
.type-travel   .list-card-icon{background:var(--blue-bg)}
.type-custom   .list-card-icon{background:var(--green-bg)}
.list-card-body{flex:1;min-width:0}
.list-card-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.list-card-sub{display:flex;align-items:center;gap:8px}
.list-card-count{font-size:12px;color:var(--text2);font-weight:500}
.progress-bar-wrap{flex:1;height:4px;background:var(--bg3);border-radius:4px;overflow:hidden;max-width:80px}
.progress-bar-fill{height:100%;border-radius:4px;background:var(--card-accent,var(--accent));transition:width .4s}
.list-card-right{display:flex;align-items:center;gap:6px}
.btn-delete{background:none;border:none;cursor:pointer;color:var(--text3);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;transition:color .15s}
.btn-delete:hover{color:#c0392b}
.chevron{color:var(--text3);font-size:14px}

.new-list-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.type-tabs{display:flex;gap:7px;margin-bottom:14px}
.type-tab{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text2);font-size:12px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer;text-align:center;transition:all .18s}
.type-tab.active.shopping{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.type-tab.active.travel{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.type-tab.active.custom{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.type-tab.active.cleaning{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}
.input-row{display:flex;gap:8px}
.input-field{flex:1;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:14px;font-weight:500;font-family:'Nunito',sans-serif;outline:none;transition:border-color .18s,background .18s}
.input-field:focus{border-color:var(--accent);background:var(--card)}
.input-field::placeholder{color:var(--text3);font-weight:400}
.btn-create{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .1s;flex-shrink:0;box-shadow:0 2px 8px rgba(201,106,46,0.3)}
.btn-create:active{transform:scale(.94)}

.filter-chips{display:flex;gap:7px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px}
.filter-chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border2);cursor:pointer;white-space:nowrap;color:var(--text2);background:var(--card);transition:all .15s}
.chip.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.chip.active.travel{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.chip.active.custom{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.chip.active.cleaning{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}

.detail-header{position:sticky;top:0;z-index:10;background:rgba(250,247,242,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:env(safe-area-inset-top,0) 0 0;border-bottom:1px solid var(--border)}
.detail-header-inner{padding:14px 18px 12px;display:flex;align-items:center;gap:12px}
.btn-back{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--text2);flex-shrink:0}
.detail-title{font-family:'Lora',serif;font-size:18px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.btn-share{background:#25D366;border:none;border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0;transition:opacity .15s}
.btn-share:hover{opacity:.85}
.detail-badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;flex-shrink:0;background:var(--accent-bg);color:var(--accent)}
.detail-badge.travel{background:var(--blue-bg);color:var(--blue)}
.detail-badge.custom{background:var(--green-bg);color:var(--green)}
.detail-badge.cleaning{background:var(--teal-bg);color:var(--teal)}

.add-item-wrap{margin-bottom:22px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.add-item-row{display:flex;gap:8px}
.btn-add-item{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:11px 16px;font-size:20px;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(201,106,46,0.25)}

.items-list{display:flex;flex-direction:column;gap:7px}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 6px rgba(100,70,30,0.05);animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.item-card.done{opacity:.45}
.checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:11px;transition:all .18s;background:var(--bg)}
.checkbox.checked{background:var(--green);border-color:var(--green);color:#fff}
.item-text{flex:1;font-size:14px;font-weight:500;color:var(--text);line-height:1.4}
.item-card.done .item-text{text-decoration:line-through;color:var(--text3)}
.stepper{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border2);border-radius:24px;overflow:hidden;flex-shrink:0}
.stepper-btn{background:none;border:none;cursor:pointer;width:32px;height:32px;color:var(--text2);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stepper-num{font-size:13px;font-weight:700;min-width:24px;text-align:center;color:var(--text);user-select:none}
.btn-item-delete{background:none;border:none;cursor:pointer;color:var(--text3);padding:5px;border-radius:7px;font-size:14px;display:flex;align-items:center}
.btn-edit-item{background:none;border:none;cursor:pointer;padding:5px;border-radius:7px;font-size:13px;display:flex;align-items:center;opacity:.6;transition:opacity .15s}
.btn-edit-item:hover{opacity:1}
.sub-label{font-size:10px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;color:var(--text3);margin:18px 0 8px 2px}
.btn-clear-done{width:100%;margin-top:14px;padding:11px;background:none;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);color:var(--text3);font-size:13px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer}
.empty-state{text-align:center;padding:40px 0 20px;color:var(--text3);font-size:14px;line-height:1.9}
.empty-emoji{font-size:38px;display:block;margin-bottom:10px}

/* Calendario */
.cal-view-toggle{display:flex;gap:6px;margin-bottom:18px}
.cal-toggle-btn{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text2);font-size:13px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer;text-align:center;transition:all .15s}
.cal-toggle-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{background:var(--bg2);border:1px solid var(--border);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text2)}
.cal-month-label{font-family:'Lora',serif;font-size:17px;font-weight:500;color:var(--text)}
.cal-grid{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}
.cal-dow{padding:8px 0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-day{min-height:44px;padding:4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border);transition:background .12s}
.cal-day:hover{background:var(--bg2)}
.cal-day.other-month .cal-day-num{opacity:.35}
.cal-day.today .cal-day-num{background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-day.has-event::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.cal-day-num{font-size:13px;font-weight:600;color:var(--text);line-height:1;margin-top:4px}
.cal-day.selected{background:var(--accent-bg)}

.events-list{display:flex;flex-direction:column;gap:8px}
.event-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;transition:transform .15s}
.event-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--purple);border-radius:4px 0 0 4px}
.event-card:active{transform:scale(.98)}
.event-date-col{display:flex;flex-direction:column;align-items:center;min-width:36px;flex-shrink:0}
.event-day-num{font-size:18px;font-weight:700;color:var(--accent);line-height:1}
.event-mon{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.04em}
.event-body{flex:1;min-width:0}
.event-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.event-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.event-meta-item{font-size:11px;color:var(--text2)}
.event-who-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(44,35,24,0.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg);border-radius:24px 24px 0 0;padding:24px 22px 40px;width:100%;max-width:480px;animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-family:'Lora',serif;font-size:18px;font-weight:500;color:var(--text);margin-bottom:18px}
.modal-field{margin-bottom:14px}
.modal-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;display:block}
.modal-input{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;color:var(--text);font-size:14px;font-weight:500;font-family:'Nunito',sans-serif;outline:none;transition:border-color .18s}
.modal-input:focus{border-color:var(--accent);background:var(--card)}
.modal-input::placeholder{color:var(--text3);font-weight:400}
.who-selector{display:flex;gap:8px}
.who-btn{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text2);font-size:12px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer;text-align:center;transition:all .15s}
.who-btn.active{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-modal-cancel{flex:1;padding:12px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);background:none;color:var(--text2);font-size:14px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer}
.btn-modal-save{flex:2;padding:12px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer}
.btn-modal-delete{padding:12px 16px;border-radius:var(--radius-sm);border:none;background:#fdf0ee;color:#c0392b;font-size:14px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer}

/* Cleaning */
.list-card.type-cleaning{--card-accent:#2a9d8f}
.type-cleaning .list-card-icon{background:var(--teal-bg)}
.type-tab.cleaning{background:var(--bg);color:var(--text2)}
.type-tab.active.cleaning{background:var(--teal-bg);border-color:var(--teal);color:var(--teal)}

/* Modal confirmación */
.confirm-overlay{position:fixed;inset:0;background:rgba(44,35,24,0.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .15s}
.confirm-box{background:var(--card);border-radius:var(--radius);padding:24px 22px;width:100%;max-width:320px;box-shadow:var(--shadow-lg)}
.confirm-title{font-family:'Lora',serif;font-size:17px;font-weight:500;color:var(--text);margin-bottom:8px}
.confirm-msg{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:20px}
.confirm-actions{display:flex;gap:8px}
.btn-confirm-cancel{flex:1;padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);background:none;color:var(--text2);font-size:14px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer}
.btn-confirm-delete{flex:1;padding:11px;border-radius:var(--radius-sm);border:none;background:#c0392b;color:#fff;font-size:14px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- HOME -->
<div id="homeView" style="display:flex;flex-direction:column;min-height:100vh">
  <div class="header">
    <div class="header-inner">
      <div class="header-left">
        <span class="header-greeting">Bienvenidos</span>
        <span class="header-title">GuapisAPP</span>
      </div>
      <span class="sync-pill"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">sync</span></span>
    </div>
  </div>
  <div class="scroll-area">
    <p class="section-label">📅 Próximos 7 días</p>
    <div class="reminder-strip" id="reminderStrip"></div>
    <div class="filter-chips" id="filterChips">
      <span class="chip active" data-filter="all">Todas</span>
      <span class="chip" data-filter="shopping">🛒 Súper</span>
      <span class="chip" data-filter="travel">🚗 Viaje</span>

<script>

const firebaseConfig = {
  apiKey:"AIzaSyB4gG7fKjLPbImsvvuAtfpWktle1B9CAiA",
  authDomain:"guapisapp.firebaseapp.com",
  databaseURL:"https://guapisapp-default-rtdb.firebaseio.com",
  projectId:"guapisapp",
  storageBucket:"guapisapp.firebasestorage.app",
  messagingSenderId:"210174345830",
  appId:"1:210174345830:web:c4b0b25725244c92c623a7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOT="listas", EROOT="eventos";

let lists={}, events={};
let activeListId=null, selectedType='shopping', activeFilter='all';
let calView='mes', calYear, calMonth, calSelectedDay=null;
let editingEventId=null, selectedWho='ambos';
const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth();
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES_FULL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return String(n).padStart(2,'0');}

function setSyncing(on){
  const d=document.getElementById('syncDot'),l=document.getElementById('syncLabel');
  if(on){d.classList.add('syncing');l.textContent='guardando';}
  else{d.classList.remove('syncing');l.textContent='sync ✓';}
}

db.ref(ROOT).on('value',snap=>{lists=snap.val()||{};setSyncing(false);renderHome();if(activeListId)renderDetail();});
db.ref(EROOT).on('value',snap=>{events=snap.val()||{};renderReminder();if(document.getElementById('calView').style.display!=='none')renderCalendar();scheduleNotifications();});

// ── Modal confirmación ──
let confirmCallback=null;
function showConfirm(title,msg,cb){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  confirmCallback=cb;
  document.getElementById('confirmModal').style.display='flex';
}
document.getElementById('btnConfirmCancel').addEventListener('click',()=>{
  document.getElementById('confirmModal').style.display='none';
  confirmCallback=null;
});
document.getElementById('btnConfirmDelete').addEventListener('click',()=>{
  document.getElementById('confirmModal').style.display='none';
  if(confirmCallback)confirmCallback();
  confirmCallback=null;
});

// ── Nav ──
window.showSection=function(sec){
  ['home','cal'].forEach(s=>{
    document.getElementById(s+'View').style.display='none';
    document.getElementById('nav-'+s).classList.remove('active');
  });
  document.getElementById('detailView').style.display='none';
  document.getElementById(sec+'View').style.display='flex';
  document.getElementById('nav-'+sec).classList.add('active');
  if(sec==='cal')renderCalendar();
};

// ── Reminder ──
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES_R=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function renderReminder(){
  const strip=document.getElementById('reminderStrip'); if(!strip)return;
  const today=new Date();today.setHours(0,0,0,0);
  const week=new Date(today);week.setDate(week.getDate()+7);
  const upcoming=Object.values(events)
    .filter(e=>{const d=new Date(e.date+'T00:00:00');return d>=today&&d<=week;})
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!upcoming.length){strip.innerHTML=`<div class="reminder-empty">Sin eventos esta semana 🌿</div>`;return;}
  strip.innerHTML=upcoming.map(ev=>{
    const d=new Date(ev.date+'T00:00:00');
    const isToday=d.toDateString()===today.toDateString();
    const whoLabel=ev.who==='ambos'?'Los dos':ev.who==='franco'?'Franco':'Fer';
    const whoCls=ev.who==='ambos'?'who-both':'who-solo';
    const diaLabel=isToday?'Hoy':DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES_R[d.getMonth()].charAt(0).toUpperCase()+MESES_R[d.getMonth()].slice(1);
    return `<div class="reminder-card" onclick="openEventModal('${ev.id}')">
      <div class="reminder-date-box ${isToday?'today':''}">
        <span class="reminder-day">${d.getDate()}</span>
        <span class="reminder-mon">${MESES[d.getMonth()]}</span>
      </div>
      <div class="reminder-info">
        <div class="reminder-title">${esc(ev.title)}</div>
        <div class="reminder-sub">${diaLabel}${ev.time?' · '+ev.time:''}</div>
      </div>
      <span class="reminder-who ${whoCls}">${whoLabel}</span>
    </div>`;
  }).join('');
}

// ── Calendario ──
window.switchCalView=function(v){
  calView=v;
  document.getElementById('calMesView').style.display=v==='mes'?'block':'none';
  document.getElementById('calListaView').style.display=v==='lista'?'block':'none';
  document.getElementById('btnMes').classList.toggle('active',v==='mes');
  document.getElementById('btnLista').classList.toggle('active',v==='lista');
  renderCalendar();
};
window.changeMonth=function(d){
  calMonth+=d;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}
  calSelectedDay=null;renderCalendar();
};
function renderCalendar(){if(calView==='mes')renderMes();else renderLista();}

function renderMes(){
  const lbl=document.getElementById('calMonthLabel');
  if(lbl)lbl.textContent=`${MESES_FULL[calMonth]} ${calYear}`;
  const daysEl=document.getElementById('calDays');if(!daysEl)return;
  const today=new Date();today.setHours(0,0,0,0);
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const eventDays=new Set(Object.values(events).filter(e=>{
    const d=new Date(e.date+'T00:00:00');
    return d.getFullYear()===calYear&&d.getMonth()===calMonth;
  }).map(e=>parseInt(e.date.split('-')[2])));
  let html='';
  for(let i=0;i<firstDay;i++){html+=`<div class="cal-day other-month"><span class="cal-day-num">${daysInPrev-firstDay+1+i}</span></div>`;}
  for(let d=1;d<=daysInMonth;d++){
    const isToday=new Date(calYear,calMonth,d).toDateString()===today.toDateString();
    const isSel=calSelectedDay===d;
    html+=`<div class="cal-day${isToday?' today':''}${eventDays.has(d)?' has-event':''}${isSel?' selected':''}" onclick="selectCalDay(${d})"><span class="cal-day-num">${d}</span></div>`;
  }
  const rem=(7-((firstDay+daysInMonth)%7))%7;
  for(let d=1;d<=rem;d++){html+=`<div class="cal-day other-month"><span class="cal-day-num">${d}</span></div>`;}
  daysEl.innerHTML=html;
  renderDayEvents();
}
window.selectCalDay=function(d){calSelectedDay=d;renderMes();};

function renderDayEvents(){
  const el=document.getElementById('calDayEvents');if(!el)return;
  if(!calSelectedDay){el.innerHTML='';return;}
  const dateStr=`${calYear}-${pad(calMonth+1)}-${pad(calSelectedDay)}`;
  const dayEvs=Object.values(events).filter(e=>e.date===dateStr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(!dayEvs.length){el.innerHTML=`<div style="text-align:center;padding:16px 0;color:var(--text3);font-size:13px">Sin eventos este día · <span style="color:var(--accent);cursor:pointer;font-weight:600" onclick="openEventModal(null)">+ Agregar</span></div>`;return;}
  el.innerHTML=`<p class="section-label" style="margin-top:4px">Eventos del día</p>`+dayEvs.map(ev=>eventCardHtml(ev)).join('');
}

function renderLista(){
  const el=document.getElementById('eventsList');if(!el)return;
  const today=new Date();today.setHours(0,0,0,0);
  const sorted=Object.values(events).filter(e=>new Date(e.date+'T00:00:00')>=today).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  if(!sorted.length){el.innerHTML=`<div class="empty-state"><span class="empty-emoji">📅</span>No hay eventos próximos.<br>Tocá + para agregar.</div>`;return;}
  el.innerHTML=sorted.map(ev=>eventCardHtml(ev)).join('');
}

function eventCardHtml(ev){
  const d=new Date(ev.date+'T00:00:00');
  const whoLabel=ev.who==='ambos'?'👫 Los dos':ev.who==='franco'?'🙋 Franco':'🙋‍♀️ Fer';
  const whoCls=ev.who==='ambos'?'who-both':'who-solo';
  return `<div class="event-card" onclick="openEventModal('${ev.id}')">
    <div class="event-date-col"><span class="event-day-num">${d.getDate()}</span><span class="event-mon">${MESES[d.getMonth()]}</span></div>
    <div class="event-body">
      <div class="event-title">${esc(ev.title)}</div>
      <div class="event-meta">
        ${ev.time?`<span class="event-meta-item">🕐 ${ev.time}</span>`:''}
        ${ev.place?`<span class="event-meta-item">📍 ${esc(ev.place)}</span>`:''}
        <span class="event-who-badge ${whoCls}">${whoLabel}</span>
      </div>
      ${ev.notes?`<div style="font-size:12px;color:var(--text2);margin-top:4px">${esc(ev.notes)}</div>`:''}
    </div>
  </div>`;
}

// ── Modal ──
window.openEventModal=function(id){
  editingEventId=id;
  document.getElementById('modalTitle').textContent=id?'Editar evento':'Nuevo evento';
  document.getElementById('btnDeleteEvent').style.display=id?'block':'none';
  if(id&&events[id]){
    const ev=events[id];
    document.getElementById('evTitle').value=ev.title||'';
    document.getElementById('evDate').value=ev.date||'';
    document.getElementById('evTime').value=ev.time||'';
    document.getElementById('evPlace').value=ev.place||'';
    document.getElementById('evNotes').value=ev.notes||'';
    selectedWho=ev.who||'ambos';
  } else {
    document.getElementById('evTitle').value='';
    document.getElementById('evDate').value=calSelectedDay?`${calYear}-${pad(calMonth+1)}-${pad(calSelectedDay)}`:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    document.getElementById('evTime').value='';
    document.getElementById('evPlace').value='';
    document.getElementById('evNotes').value='';
    selectedWho='ambos';
  }
  document.querySelectorAll('.who-btn').forEach(b=>b.classList.toggle('active',b.dataset.who===selectedWho));
  document.getElementById('eventModal').style.display='flex';
};
window.closeModal=function(){document.getElementById('eventModal').style.display='none';editingEventId=null;};
window.closeModalOutside=function(e){if(e.target.id==='eventModal')closeModal();};
window.selectWho=function(el){document.querySelectorAll('.who-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');selectedWho=el.dataset.who;};
window.saveEvent=async function(){
  const title=document.getElementById('evTitle').value.trim();
  const date=document.getElementById('evDate').value;
  const time=document.getElementById('evTime').value;
  if(!title||!date){alert('Título y fecha son obligatorios');return;}
  if(!time){alert('La hora es obligatoria para poder enviarte recordatorios');return;}
  const id=editingEventId||genId();
  setSyncing(true);
  await db.ref(`${EROOT}/${id}`).set({id,title,date,time,
    place:document.getElementById('evPlace').value.trim()||'',
    notes:document.getElementById('evNotes').value.trim()||'',
    who:selectedWho});
  setSyncing(false);
  closeModal();
  scheduleNotifications();
};
window.deleteCurrentEvent=async function(){
  if(!editingEventId)return;
  const ev=events[editingEventId];
  const name=ev?ev.title:'este evento';
  showConfirm('¿Eliminar evento?',`"${name}" será eliminado permanentemente.`,async()=>{
    setSyncing(true);await db.ref(`${EROOT}/${editingEventId}`).remove();setSyncing(false);closeModal();
  });
};

// ── Listas ──
window._addList=async function(name,type){const id=genId();setSyncing(true);await db.ref(`${ROOT}/${id}`).set({id,name,type,items:{}});setSyncing(false);};
window._deleteList=async function(id){setSyncing(true);await db.ref(`${ROOT}/${id}`).remove();setSyncing(false);};
window._addItem=async function(lid,text,qty){const id=genId();setSyncing(true);await db.ref(`${ROOT}/${lid}/items/${id}`).set({id,text,qty,done:false});setSyncing(false);};
window._toggleItem=async function(lid,iid,cur){setSyncing(true);await db.ref(`${ROOT}/${lid}/items/${iid}`).update({done:!cur});setSyncing(false);};
window._changeQty=async function(lid,iid,qty){setSyncing(true);await db.ref(`${ROOT}/${lid}/items/${iid}`).update({qty});setSyncing(false);};
window._deleteItem=async function(lid,iid){setSyncing(true);await db.ref(`${ROOT}/${lid}/items/${iid}`).remove();setSyncing(false);};
window._updateItemText=async function(lid,iid,text){setSyncing(true);await db.ref(`${ROOT}/${lid}/items/${iid}`).update({text});setSyncing(false);};
window._clearDone=async function(lid){
  const lst=lists[lid];if(!lst)return;
  const upd={};Object.values(lst.items||{}).filter(i=>i.done).forEach(i=>{upd[`${ROOT}/${lid}/items/${i.id}`]=null;});
  setSyncing(true);await db.ref().update(upd);setSyncing(false);
};

function shareList(){
  const lst=lists[activeListId];if(!lst)return;
  const emoji=lst.type==='shopping'?'🛒':lst.type==='travel'?'🚗':lst.type==='cleaning'?'🧹':'📋';
  const items=Object.values(lst.items||{});
  const pending=items.filter(i=>!i.done);
  const done=items.filter(i=>i.done);
  let texto=`${emoji} *${lst.name}*\n\n`;
  if(pending.length){
    pending.forEach(i=>{
      const qty=typeof i.qty==='number'?` x${i.qty}`:(i.qty?' '+i.qty:'');
      texto+=`☐ ${i.text}${qty}\n`;
    });
  }
  if(done.length){
    texto+='\n';
    done.forEach(i=>{
      const qty=typeof i.qty==='number'?` x${i.qty}`:(i.qty?' '+i.qty:'');
      texto+=`✓ ${i.text}${qty}\n`;
    });
  }
  if(!items.length) texto+='_(lista vacía)_\n';
  const url='https://wa.me/?text='+encodeURIComponent(texto.trim());
  window.open(url,'_blank');
}

function renderHome(){
  const all=Object.values(lists);

  // ── Chips dinámicos ──
  const tipos=new Set(all.map(l=>l.type));
  const chipsEl=document.getElementById('filterChips');
  const multiTipo=tipos.size>1;
  if(!multiTipo){
    // Solo un tipo: ocultar chips y forzar filtro al tipo existente
    chipsEl.style.display='none';
    activeFilter=tipos.size===1?[...tipos][0]:'all';
  } else {
    chipsEl.style.display='flex';
    // Reconstruir chips con solo los tipos que existen + "Todas"
    const etiquetas={shopping:'🛒 Súper',travel:'🚗 Viaje',custom:'📋 Otras',cleaning:'🧹 Limpieza'};
    const extraClass={shopping:'',travel:'travel',custom:'custom',cleaning:'cleaning'};
    let html=`<span class="chip ${activeFilter==='all'?'active':''}" data-filter="all">Todas</span>`;
    ['shopping','travel','cleaning','custom'].forEach(t=>{
      if(tipos.has(t)){
        html+=`<span class="chip ${activeFilter===t?'active':''}${extraClass[t]?' '+extraClass[t]:''}" data-filter="${t}">${etiquetas[t]}</span>`;
      }
    });
    chipsEl.innerHTML=html;
    // Si el filtro activo ya no existe, resetear a all
    if(activeFilter!=='all'&&!tipos.has(activeFilter))activeFilter='all';
    chipsEl.querySelectorAll('.chip').forEach(c=>{
      c.addEventListener('click',()=>{
        activeFilter=c.dataset.filter;
        renderHome();
      });
    });
  }

  const grid=document.getElementById('listsGrid');
  const visible=all.filter(l=>activeFilter==='all'||l.type===activeFilter);
  if(!visible.length){grid.innerHTML=`<div class="empty-state"><span class="empty-emoji">🗒️</span>No hay listas todavía.<br>Creá la primera abajo.</div>`;return;}
  grid.innerHTML=visible.map(lst=>{
    const items=Object.values(lst.items||{});
    const total=items.length,done=items.filter(i=>i.done).length;
    const pct=total?Math.round(done/total*100):0;
    const emoji=lst.type==='shopping'?'🛒':lst.type==='travel'?'🚗':lst.type==='cleaning'?'🧹':'📋';
    return `<div class="list-card type-${lst.type}" onclick="openList('${lst.id}')">
      <div class="list-card-icon">${emoji}</div>
      <div class="list-card-body">
        <div class="list-card-name">${esc(lst.name)}</div>
        <div class="list-card-sub"><span class="list-card-count">${done}/${total}</span><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div></div>
      </div>
      <div class="list-card-right">
        <button class="btn-delete" onclick="event.stopPropagation();deleteList('${lst.id}')">✕</button>
        <span class="chevron">›</span>
      </div>
    </div>`;
  }).join('');
}

window.selectType=function(el){document.querySelectorAll('.type-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');selectedType=el.dataset.type;};
window.addList=function(){
  const defaultNames={shopping:'Súper',travel:'Viaje',custom:'Otra',cleaning:'Limpieza'};
  const name=defaultNames[selectedType]||'Nueva lista';
  window._addList(name,selectedType);
};
window.deleteList=function(id){
  const lst=lists[id];
  const name=lst?lst.name:'esta lista';
  showConfirm('¿Eliminar lista?',`"${name}" y todos sus ítems serán eliminados permanentemente.`,()=>window._deleteList(id));
};

window.openList=function(id){
  activeListId=id;
  document.getElementById('homeView').style.display='none';
  document.getElementById('calView').style.display='none';
  document.getElementById('detailView').style.display='flex';
  renderDetail();
  setTimeout(()=>document.getElementById('newItemInput').focus(),120);
};
window.goHome=function(){
  activeListId=null;
  document.getElementById('detailView').style.display='none';
  document.getElementById('homeView').style.display='flex';
  renderHome();
};

function renderDetail(){
  const lst=lists[activeListId];if(!lst){goHome();return;}
  const isShopping=lst.type==='shopping';
  const items=Object.values(lst.items||{});
  const done=items.filter(i=>i.done).length;
  const emoji=lst.type==='shopping'?'🛒':lst.type==='travel'?'🚗':lst.type==='cleaning'?'🧹':'📋';
  document.getElementById('detailTitle').textContent=emoji+' '+lst.name;
  const badge=document.getElementById('detailBadge');
  badge.textContent=`${done}/${items.length}`;
  badge.className='detail-badge'+(lst.type==='travel'?' travel':lst.type==='custom'?' custom':lst.type==='cleaning'?' cleaning':'');
  const pending=items.filter(i=>!i.done),doneArr=items.filter(i=>i.done);
  let html='';
  if(!items.length){html=`<div class="empty-state"><span class="empty-emoji">🛍️</span>Lista vacía.<br>Agregá el primer ítem arriba.</div>`;}
  else{
    pending.forEach(item=>{html+=itemHtml(item,isShopping);});
    if(doneArr.length){
      html+=`<div class="sub-label">Completados (${doneArr.length})</div>`;
      doneArr.forEach(item=>{html+=itemHtml(item,isShopping);});
      html+=`<button class="btn-clear-done" onclick="clearDone()">🗑 Limpiar completados</button>`;
    }
  }
  document.getElementById('itemsList').innerHTML=html;
}

function itemHtml(item,isShopping){
  const qty=typeof item.qty==='number'?item.qty:1;
  const stepper=`<div class="stepper"><button class="stepper-btn" onclick="changeQty('${item.id}',-1)">−</button><span class="stepper-num">${qty}</span><button class="stepper-btn" onclick="changeQty('${item.id}',1)">+</button></div>`;
  return `<div class="item-card ${item.done?'done':''}">
    <div class="checkbox ${item.done?'checked':''}" onclick="toggleItem('${item.id}')">${item.done?'✓':''}</div>
    <span class="item-text" id="itxt-${item.id}">${esc(item.text)}</span>
    ${stepper}
    <button class="btn-edit-item" onclick="editItem('${item.id}')" title="Editar">✏️</button>
    <button class="btn-item-delete" onclick="deleteItem('${item.id}')">✕</button>
  </div>`;
}

window.editItem=function(iid){
  const lst=lists[activeListId];if(!lst)return;
  const item=(lst.items||{})[iid];if(!item)return;
  const span=document.getElementById('itxt-'+iid);if(!span)return;
  const original=item.text;
  span.outerHTML=`<input class="item-edit-input" id="iedit-${iid}" value="${esc(original)}" style="flex:1;font-size:14px;font-weight:500;font-family:'Nunito',sans-serif;border:1.5px solid var(--accent);border-radius:7px;padding:3px 8px;background:var(--card);color:var(--text);outline:none">`;
  const inp=document.getElementById('iedit-'+iid);
  inp.focus();inp.select();
  function save(){
    const newText=inp.value.trim();
    if(newText&&newText!==original){
      item.text=newText;
      window._updateItemText(activeListId,iid,newText);
    } else {
      renderDetail();
    }
  }
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')save();if(e.key==='Escape')renderDetail();});
  inp.addEventListener('blur',save);
};

window.addItem=function(){
  const inp=document.getElementById('newItemInput');let text=inp.value.trim();if(!text||!activeListId)return;
  let qty=1;
  const m=text.match(/^(.+)\s+x(\d+)$/i);if(m){text=m[1].trim();qty=parseInt(m[2]);}
  inp.value='';window._addItem(activeListId,text,qty);setTimeout(()=>inp.focus(),60);
};
window.changeQty=function(iid,delta){const lst=lists[activeListId];if(!lst)return;const item=(lst.items||{})[iid];if(!item)return;const cur=typeof item.qty==='number'?item.qty:1;window._changeQty(activeListId,iid,Math.max(1,cur+delta));};
window.toggleItem=function(iid){const lst=lists[activeListId];if(!lst)return;const item=(lst.items||{})[iid];if(item)window._toggleItem(activeListId,iid,item.done);};
window.deleteItem=function(iid){window._deleteItem(activeListId,iid);};
window.clearDone=function(){window._clearDone(activeListId);};

// ── Notificaciones ──
async function requestNotificationPermission(){
  if(!('Notification' in window)||!('serviceWorker' in navigator))return false;
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied')return false;
  const result=await Notification.requestPermission();
  return result==='granted';
}

async function scheduleNotifications(){
  const granted=await requestNotificationPermission();
  if(!granted)return;
  const now=new Date();
  const scheduled=[];
  Object.values(events).forEach(ev=>{
    if(!ev.date||!ev.time)return;
    const evDate=new Date(ev.date+'T'+ev.time+':00');
    if(evDate<=now)return;
    // 1 hora antes
    const oneHourBefore=new Date(evDate.getTime()-60*60*1000);
    if(oneHourBefore>now){
      scheduled.push({
        time:oneHourBefore.getTime(),
        title:'⏰ GuapisAPP',
        body:`En 1 hora: ${ev.title}${ev.place?' — '+ev.place:''}`
      });
    }
    // Día anterior a las 9:00 AM
    const dayBefore=new Date(ev.date+'T09:00:00');
    dayBefore.setDate(dayBefore.getDate()-1);
    if(dayBefore>now){
      scheduled.push({
        time:dayBefore.getTime(),
        title:'📅 GuapisAPP',
        body:`Mañana: ${ev.title} a las ${ev.time}${ev.place?' — '+ev.place:''}`
      });
    }
  });
  // Guardar en localStorage para que el SW los lea
  localStorage.setItem('guapisapp_notifs',JSON.stringify(scheduled));
  // Notificar al SW que hay nuevas notificaciones programadas
  const reg=await navigator.serviceWorker.ready;
  if(reg.active){
    reg.active.postMessage({type:'SCHEDULE',notifications:scheduled});
  }
}

// Registrar Service Worker y pedir permisos al cargar
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/GuapisAPP/sw.js')
    .then(()=>{ scheduleNotifications(); })
    .catch(err=>console.log('SW error:',err));
}
