<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GuapisAPP">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>GuapisAPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #faf7f2;
  --bg2:      #f3ede3;
  --bg3:      #ede5d8;
  --card:     #ffffff;
  --border:   rgba(160,130,90,0.15);
  --border2:  rgba(160,130,90,0.28);
  --text:     #2c2318;
  --text2:    #7a6650;
  --text3:    #b09a80;
  --accent:   #c96a2e;
  --accent-bg:#fdf0e8;
  --accent2:  #e8a96a;
  --green:    #5a9e6f;
  --green-bg: #edf6f0;
  --blue:     #4a7fa5;
  --blue-bg:  #eaf2f8;
  --radius:   18px;
  --radius-sm:12px;
  --shadow:   0 2px 16px rgba(100,70,30,0.08);
  --shadow-lg:0 8px 32px rgba(100,70,30,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
}

/* ── Grain texture overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 128px;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(250,247,242,0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: env(safe-area-inset-top, 0) 0 0;
  border-bottom: 1px solid var(--border);
}
.header-inner {
  padding: 16px 22px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; flex-direction: column; gap: 1px; }
.header-greeting {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text3);
}
.header-title {
  font-family: 'Lora', serif;
  font-size: 22px; font-weight: 500;
  color: var(--text); letter-spacing: -0.01em;
}
.sync-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg2); border-radius: 20px;
  padding: 6px 12px; border: 1px solid var(--border);
  font-size: 11px; font-weight: 600; color: var(--text3);
  letter-spacing: .03em;
}
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  transition: background .3s;
}
.sync-dot.syncing { background: var(--accent2); animation: blink .8s infinite; }
.sync-dot.offline { background: var(--text3); }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.25} }

/* ── Scroll area ── */
.scroll-area {
  flex: 1; overflow-y: auto;
  padding: 24px 20px 40px;
  -webkit-overflow-scrolling: touch;
}

/* ── Section label ── */
.section-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--text3);
  margin: 0 0 12px 2px;
}

/* ── List cards ── */
.lists-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }

.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s;
  position: relative; overflow: hidden;
}
.list-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; border-radius: 4px 0 0 4px;
  background: var(--card-accent, var(--accent));
  transition: width .2s;
}
.list-card:active { transform: scale(0.985); box-shadow: var(--shadow-lg); }

.list-card.type-shopping { --card-accent: #c96a2e; }
.list-card.type-travel   { --card-accent: #4a7fa5; }
.list-card.type-custom   { --card-accent: #5a9e6f; }

.list-card-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.type-shopping .list-card-icon { background: var(--accent-bg); }
.type-travel   .list-card-icon { background: var(--blue-bg); }
.type-custom   .list-card-icon { background: var(--green-bg); }

.list-card-body { flex: 1; min-width: 0; }
.list-card-name {
  font-size: 15px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.list-card-sub { display: flex; align-items: center; gap: 8px; }
.list-card-count { font-size: 12px; color: var(--text2); font-weight: 500; }
.progress-bar-wrap {
  flex: 1; height: 4px; background: var(--bg3);
  border-radius: 4px; overflow: hidden; max-width: 80px;
}
.progress-bar-fill {
  height: 100%; border-radius: 4px;
  background: var(--card-accent, var(--accent));
  transition: width .4s;
}

.list-card-right { display: flex; align-items: center; gap: 6px; }
.btn-delete {
  background: none; border: none; cursor: pointer;
  color: var(--text3); width: 30px; height: 30px;
  border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 14px;
  transition: color .15s, background .15s;
}
.btn-delete:hover { color: #c0392b; background: #fdf0ee; }
.chevron { color: var(--text3); font-size: 14px; }

/* ── New list box ── */
.new-list-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow);
}
.type-tabs { display: flex; gap: 7px; margin-bottom: 14px; }
.type-tab {
  flex: 1; padding: 8px 4px; border-radius: 10px;
  border: 1.5px solid var(--border2); background: var(--bg);
  color: var(--text2); font-size: 12px; font-weight: 600;
  font-family: 'Nunito', sans-serif;
  cursor: pointer; text-align: center; transition: all .18s;
}
.type-tab.active.shopping { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.type-tab.active.travel   { background: var(--blue-bg);   border-color: var(--blue);   color: var(--blue); }
.type-tab.active.custom   { background: var(--green-bg);  border-color: var(--green);  color: var(--green); }

.input-row { display: flex; gap: 8px; }
.input-field {
  flex: 1; background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 14px;
  color: var(--text); font-size: 14px; font-weight: 500;
  font-family: 'Nunito', sans-serif; outline: none;
  transition: border-color .18s, background .18s;
}
.input-field:focus { border-color: var(--accent); background: var(--card); }
.input-field::placeholder { color: var(--text3); font-weight: 400; }

.btn-create {
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 11px 18px;
  font-size: 22px; font-weight: 400; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .15s, transform .1s; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(201,106,46,0.3);
}
.btn-create:hover { opacity: .88; }
.btn-create:active { transform: scale(.94); }

/* ── Empty state ── */
.empty-state {
  text-align: center; padding: 40px 0 20px;
  color: var(--text3); font-size: 14px; line-height: 1.9;
}
.empty-emoji { font-size: 38px; display: block; margin-bottom: 10px; }

/* ── Detail view ── */
.detail-header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(250,247,242,0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: env(safe-area-inset-top, 0) 0 0;
  border-bottom: 1px solid var(--border);
}
.detail-header-inner {
  padding: 14px 18px 12px;
  display: flex; align-items: center; gap: 12px;
}
.btn-back {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: pointer; color: var(--text2);
  flex-shrink: 0; transition: background .15s;
}
.btn-back:hover { background: var(--bg3); }
.detail-title {
  font-family: 'Lora', serif;
  font-size: 18px; font-weight: 500; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
.detail-badge {
  font-size: 12px; font-weight: 600; padding: 4px 10px;
  border-radius: 20px; flex-shrink: 0;
  background: var(--accent-bg); color: var(--accent);
}
.detail-badge.travel { background: var(--blue-bg); color: var(--blue); }
.detail-badge.custom { background: var(--green-bg); color: var(--green); }

/* ── Add item ── */
.add-item-wrap {
  margin-bottom: 22px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow);
}
.add-item-row { display: flex; gap: 8px; }
.add-item-row .input-field { font-size: 14px; }
.btn-add-item {
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 11px 16px;
  font-size: 20px; cursor: pointer; flex-shrink: 0;
  transition: opacity .15s, transform .1s;
  box-shadow: 0 2px 8px rgba(201,106,46,0.25);
}
.btn-add-item:hover { opacity: .88; }
.btn-add-item:active { transform: scale(.93); }

/* ── Items ── */
.items-list { display: flex; flex-direction: column; gap: 7px; }

.item-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 13px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 1px 6px rgba(100,70,30,0.05);
  transition: opacity .25s, transform .15s;
  animation: slideIn .2s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.item-card.done { opacity: .45; }

.checkbox {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; font-size: 11px;
  transition: all .18s; background: var(--bg);
}
.checkbox.checked {
  background: var(--green); border-color: var(--green); color: #fff;
}
.item-text {
  flex: 1; font-size: 14px; font-weight: 500; color: var(--text);
  line-height: 1.4;
}
.item-card.done .item-text { text-decoration: line-through; color: var(--text3); }

/* ── Stepper ── */
.stepper {
  display: flex; align-items: center;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 24px; overflow: hidden; flex-shrink: 0;
}
.stepper-btn {
  background: none; border: none; cursor: pointer;
  width: 32px; height: 32px; color: var(--text2); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s; flex-shrink: 0;
}
.stepper-btn:active { background: var(--bg3); color: var(--accent); }
.stepper-num {
  font-size: 13px; font-weight: 700; min-width: 24px;
  text-align: center; color: var(--text);
  font-family: 'Nunito', sans-serif; user-select: none;
}

.btn-item-delete {
  background: none; border: none; cursor: pointer;
  color: var(--text3); padding: 5px; border-radius: 7px;
  font-size: 14px; display: flex; align-items: center;
  transition: color .15s;
}
.btn-item-delete:hover { color: #c0392b; }

.sub-label {
  font-size: 10px; letter-spacing: .08em; font-weight: 700;
  text-transform: uppercase; color: var(--text3); margin: 18px 0 8px 2px;
}
.btn-clear-done {
  width: 100%; margin-top: 14px; padding: 11px;
  background: none; border: 1.5px dashed var(--border2);
  border-radius: var(--radius-sm); color: var(--text3);
  font-size: 13px; font-weight: 600; font-family: 'Nunito', sans-serif;
  cursor: pointer; transition: all .15s;
}
.btn-clear-done:hover { color: #c0392b; border-color: rgba(192,57,43,.35); background: #fdf5f5; }

/* ── Filter chips ── */
.filter-chips { display: flex; gap: 7px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 2px; }
.filter-chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1.5px solid var(--border2); cursor: pointer; white-space: nowrap;
  color: var(--text2); background: var(--card);
  transition: all .15s;
}
.chip.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.chip.active.travel { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
.chip.active.custom { background: var(--green-bg); border-color: var(--green); color: var(--green); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
</style>
</head>
<body>

<!-- ══ HOME VIEW ══ -->
<div id="homeView" style="display:flex; flex-direction:column; min-height:100vh">
  <div class="header">
    <div class="header-inner">
      <div class="header-left">
        <span class="header-greeting">Bienvenidos</span>
        <span class="header-title">GuapisAPP</span>
      </div>
      <span class="sync-pill">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncLabel">sync</span>
      </span>
    </div>
  </div>

  <div class="scroll-area" id="homeScroll">
    <div class="filter-chips" id="filterChips">
      <span class="chip active" data-filter="all">Todas</span>
      <span class="chip" data-filter="shopping">🛒 Súper</span>
      <span class="chip" data-filter="travel">🚗 Viaje</span>
      <span class="chip" data-filter="custom">📋 Otras</span>
    </div>

    <p class="section-label">Tus listas</p>
    <div class="lists-grid" id="listsGrid"></div>

    <p class="section-label">Nueva lista</p>
    <div class="new-list-box">
      <div class="type-tabs">
        <button class="type-tab active shopping" data-type="shopping" onclick="selectType(this)">🛒 Súper</button>
        <button class="type-tab travel"           data-type="travel"   onclick="selectType(this)">🚗 Viaje</button>
        <button class="type-tab custom"           data-type="custom"   onclick="selectType(this)">📋 Otra</button>
      </div>
      <div class="input-row">
        <input class="input-field" id="newListName" placeholder="Nombre de la lista…" onkeydown="if(event.key==='Enter')addList()">
        <button class="btn-create" onclick="addList()">+</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ DETAIL VIEW ══ -->
<div id="detailView" style="display:none; flex-direction:column; min-height:100vh">
  <div class="detail-header">
    <div class="detail-header-inner">
      <button class="btn-back" onclick="goHome()">←</button>
      <span class="detail-title" id="detailTitle"></span>
      <span class="detail-badge" id="detailBadge"></span>
    </div>
  </div>

  <div class="scroll-area">
    <div class="add-item-wrap">
      <div class="add-item-row">
        <input class="input-field" id="newItemInput" placeholder="Agregar ítem…" onkeydown="if(event.key==='Enter')addItem()">
        <button class="btn-add-item" onclick="addItem()">+</button>
      </div>
    </div>
    <div class="items-list" id="itemsList"></div>
  </div>
</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:            "AIzaSyB4gG7fKjLPbImsvvuAtfpWktle1B9CAiA",
  authDomain:        "guapisapp.firebaseapp.com",
  databaseURL:       "https://guapisapp-default-rtdb.firebaseio.com",
  projectId:         "guapisapp",
  storageBucket:     "guapisapp.firebasestorage.app",
  messagingSenderId: "210174345830",
  appId:             "1:210174345830:web:c4b0b25725244c92c623a7"
};

const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);
const ROOT  = "listas";

let lists = {};
let activeListId = null;
let selectedType = 'shopping';
let activeFilter = 'all';

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Sync indicator ──
function setSyncing(on) {
  const d = document.getElementById('syncDot');
  const l = document.getElementById('syncLabel');
  if (on) { d.classList.add('syncing'); l.textContent = 'guardando'; }
  else    { d.classList.remove('syncing'); l.textContent = 'sync ✓'; }
}

// ── Escuchar cambios de Firebase en tiempo real ──
onValue(ref(db, ROOT), snap => {
  lists = snap.val() || {};
  setSyncing(false);
  renderHome();
  if (activeListId) renderDetail();
});

// ── Adaptar funciones que modifican datos para usar Firebase ──
window._addList = async function(name, type) {
  const id = genId();
  setSyncing(true);
  await set(ref(db, `${ROOT}/${id}`), { id, name, type, items: {} });
};

window._deleteList = async function(id) {
  setSyncing(true);
  await remove(ref(db, `${ROOT}/${id}`));
};

window._addItem = async function(lid, text, qty) {
  const id = genId();
  setSyncing(true);
  await set(ref(db, `${ROOT}/${lid}/items/${id}`), { id, text, qty, done: false });
};

window._toggleItem = async function(lid, iid, currentDone) {
  setSyncing(true);
  await update(ref(db, `${ROOT}/${lid}/items/${iid}`), { done: !currentDone });
};

window._changeQty = async function(lid, iid, newQty) {
  setSyncing(true);
  await update(ref(db, `${ROOT}/${lid}/items/${iid}`), { qty: newQty });
};

window._deleteItem = async function(lid, iid) {
  setSyncing(true);
  await remove(ref(db, `${ROOT}/${lid}/items/${iid}`));
};

window._clearDone = async function(lid) {
  const lst = lists[lid];
  if (!lst) return;
  const updates = {};
  Object.values(lst.items||{}).filter(i=>i.done).forEach(i => {
    updates[`${ROOT}/${lid}/items/${i.id}`] = null;
  });
  setSyncing(true);
  await update(ref(db), updates);
};

// ── Home ──
function renderHome() {
  const grid = document.getElementById('listsGrid');
  const all = Object.values(lists);
  const visible = all.filter(l => activeFilter === 'all' || l.type === activeFilter);
  if (visible.length === 0) {
    grid.innerHTML = `<div class="empty-state"><span class="empty-emoji">🗒️</span>No hay listas todavía.<br>Creá la primera abajo.</div>`;
    return;
  }
  grid.innerHTML = visible.map(lst => {
    const items = Object.values(lst.items || {});
    const total = items.length, done = items.filter(i=>i.done).length;
    const pct = total ? Math.round(done/total*100) : 0;
    const emoji = lst.type==='shopping'?'🛒':lst.type==='travel'?'🚗':'📋';
    return `<div class="list-card type-${lst.type}" onclick="openList('${lst.id}')">
      <div class="list-card-icon">${emoji}</div>
      <div class="list-card-body">
        <div class="list-card-name">${esc(lst.name)}</div>
        <div class="list-card-sub">
          <span class="list-card-count">${done}/${total}</span>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        </div>
      </div>
      <div class="list-card-right">
        <button class="btn-delete" onclick="event.stopPropagation();deleteList('${lst.id}')" aria-label="Borrar">✕</button>
        <span class="chevron">›</span>
      </div>
    </div>`;
  }).join('');
}

window.selectType = function(el) {
  document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  selectedType = el.dataset.type;
};

window.addList = function() {
  const inp = document.getElementById('newListName');
  const name = inp.value.trim();
  if (!name) return;
  inp.value = '';
  window._addList(name, selectedType);
};

window.deleteList = function(id) {
  window._deleteList(id);
};

// ── Detail ──
window.openList = function(id) {
  activeListId = id;
  document.getElementById('homeView').style.display  = 'none';
  document.getElementById('detailView').style.display = 'flex';
  renderDetail();
  setTimeout(() => document.getElementById('newItemInput').focus(), 120);
};

window.goHome = function() {
  activeListId = null;
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('homeView').style.display   = 'flex';
  renderHome();
};

function renderDetail() {
  const lst = lists[activeListId];
  if (!lst) { goHome(); return; }
  const isShopping = lst.type === 'shopping';
  const items = Object.values(lst.items || {});
  const done = items.filter(i=>i.done).length;
  const emoji = lst.type==='shopping'?'🛒':lst.type==='travel'?'🚗':'📋';

  document.getElementById('detailTitle').textContent = emoji + ' ' + lst.name;
  const badge = document.getElementById('detailBadge');
  badge.textContent = `${done}/${items.length}`;
  badge.className = 'detail-badge' + (lst.type==='travel'?' travel':lst.type==='custom'?' custom':'');

  const pending = items.filter(i=>!i.done);
  const doneArr  = items.filter(i=>i.done);
  let html = '';

  if (items.length === 0) {
    html = `<div class="empty-state"><span class="empty-emoji">🛍️</span>Lista vacía.<br>Agregá el primer ítem arriba.</div>`;
  } else {
    pending.forEach(item => { html += itemHtml(item, isShopping); });
    if (doneArr.length > 0) {
      html += `<div class="sub-label">Completados (${doneArr.length})</div>`;
      doneArr.forEach(item => { html += itemHtml(item, isShopping); });
      html += `<button class="btn-clear-done" onclick="clearDone()">🗑 Limpiar completados</button>`;
    }
  }
  document.getElementById('itemsList').innerHTML = html;
}

function itemHtml(item, isShopping) {
  const qty = typeof item.qty === 'number' ? item.qty : (item.qty || '');
  const stepper = isShopping
    ? `<div class="stepper">
         <button class="stepper-btn" onclick="changeQty('${item.id}',-1)">−</button>
         <span class="stepper-num">${qty||1}</span>
         <button class="stepper-btn" onclick="changeQty('${item.id}',1)">+</button>
       </div>`
    : (qty ? `<span style="font-size:12px;color:var(--text2);font-weight:600">${esc(qty)}</span>` : '');
  return `<div class="item-card ${item.done?'done':''}" id="ic-${item.id}">
    <div class="checkbox ${item.done?'checked':''}" onclick="toggleItem('${item.id}')">
      ${item.done?'✓':''}
    </div>
    <span class="item-text">${esc(item.text)}</span>
    ${stepper}
    <button class="btn-item-delete" onclick="deleteItem('${item.id}')">✕</button>
  </div>`;
}

window.addItem = function() {
  const inp = document.getElementById('newItemInput');
  let text = inp.value.trim();
  if (!text || !activeListId) return;
  const lst = lists[activeListId];
  const isShopping = lst && lst.type === 'shopping';
  let qty = isShopping ? 1 : '';
  const m = text.match(/^(.+)\s+x(\d+)$/i);
  if (m) { text = m[1].trim(); qty = isShopping ? parseInt(m[2]) : 'x'+m[2]; }
  inp.value = '';
  window._addItem(activeListId, text, qty);
  setTimeout(() => inp.focus(), 60);
};

window.changeQty = function(iid, delta) {
  const lst = lists[activeListId];
  if (!lst) return;
  const item = (lst.items||{})[iid];
  if (!item) return;
  const cur = typeof item.qty==='number' ? item.qty : 1;
  window._changeQty(activeListId, iid, Math.max(1, cur + delta));
};

window.toggleItem = function(iid) {
  const lst = lists[activeListId];
  if (!lst) return;
  const item = (lst.items||{})[iid];
  if (item) window._toggleItem(activeListId, iid, item.done);
};

window.deleteItem = function(iid) {
  window._deleteItem(activeListId, iid);
};

window.clearDone = function() {
  window._clearDone(activeListId);
};

// ── Filter chips ──
document.getElementById('filterChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  activeFilter = chip.dataset.filter;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.remove('active','travel','custom');
  });
  chip.classList.add('active');
  if (activeFilter === 'travel') chip.classList.add('travel');
  if (activeFilter === 'custom') chip.classList.add('custom');
  renderHome();
});

// ── Init ──
renderHome();
</script>
</body>
</html>
